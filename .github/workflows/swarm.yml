name: swarm
# Keeps the Hivemind economy alive on NEAR testnet. Each run ticks once a minute for ~1 hour; a new run is
# queued every 30 minutes and starts as soon as the previous one ends (concurrency queue), so coverage is continuous.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: write  # publishes the event → tx map to the `txmap` branch
  actions: write   # lets each run queue the next one (self-chaining keeps the agents alive)
concurrency:
  group: swarm
  cancel-in-progress: false
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Restore AI spend meter
        uses: actions/cache@v4
        with:
          path: .keys/llm-usage.json
          key: llm-usage-v4-${{ github.run_id }}
          restore-keys: llm-usage-v4-
      - name: Seed spend meter on first run (counts AI spend made before cloud hosting)
        run: |
          mkdir -p .keys
          [ -f .keys/llm-usage.json ] || echo "{\"day\":\"$(date -u +%F)\",\"spentDay\":0,\"bgDay\":0,\"guestDay\":0,\"spentTotal\":1,\"calls\":0,\"note\":\"seed: spend before cloud hosting, rounded up\"}" > .keys/llm-usage.json
          cat .keys/llm-usage.json
      - name: Run swarm ticks
        env:
          HIVE_KEYS: ${{ secrets.HIVE_KEYS }}
          GH_TOKEN: ${{ github.token }}   # lets the swarm publish tx links every 10 ticks
          NEARAI_API_KEY: ${{ secrets.NEARAI_API_KEY }}
          HIVE_ENVELOPE_SECRET: ${{ secrets.HIVE_ENVELOPE_SECRET }}
          TICK_SECONDS: '60'
          HIVE_POST_EVERY_MIN: '120'
          HIVE_LLM_DAILY_USD: '0.25'
          HIVE_LLM_GUEST_DAILY_USD: '0.5'
          HIVE_LLM_TOTAL_USD: '8'
          HIVE_SCAM_EVERY_MIN: '240'
          NEAR_RPC: https://near-testnet.drpc.org,https://rpc.testnet.near.org,https://test.rpc.fastnear.com
        run: |
          if [ -z "$HIVE_KEYS" ]; then echo "HIVE_KEYS secret not set; the swarm runs from the operator's machine instead. Skipping."; exit 0; fi
          node agents/swarm.mjs --ticks 35
      - name: Link any recent events still missing a tx (exact, from NEAR RPC; after the agents' turns so it never delays them)
        if: always()
        timeout-minutes: 8
        env:
          NEAR_RPC: https://near-testnet.drpc.org,https://rpc.testnet.near.org
        run: node scripts/link-from-chain.mjs --recent 200 || true   # exact, straight from NEAR RPC (no indexer)
      - name: Publish exact event → transaction map (txmap branch, read by the dashboard)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-txmap.mjs .keys/txmap-new.json || true
      - name: Queue the next run (keeps the economy alive through judging; stops after 2026-11-21)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%Y%m%d)" -le 20261121 ]; then gh workflow run swarm.yml --ref main -R "$GITHUB_REPOSITORY" && echo "next run queued"; else echo "past 2026-11-21: not chaining"; fi
